<div class="login-wrapper">
  <div class="login-container">

    <h2>Crie sua conta</h2>

    <form (ngSubmit)="cadastrar()" novalidate>

      <div class="input-group">
        <label for="nome">Nome completo</label>
        <input
          type="text"
          id="nome"
          name="nome"
          [(ngModel)]="nome"
          placeholder="Digite seu nome completo"
        >
      </div>

      <div class="input-group">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Digite seu e-mail"
        >
      </div>

      <div class="input-group">
        <label for="CPF">CPF</label>
        <input
          type="text"
          id="CPF"
          name="CPF"
          [(ngModel)]="CPF"
          placeholder="informe seu CPF (somente números)"
          maxlength="11"
          required
          [class.invalido]="erro('CPF')"
          (blur)="tocar('CPF')"
        >
      </div>

      <div class="input-group">
        <label for="datanascimento">Data de nascimento</label>
        <input
          type="date"
          id="datanascimento"
          name="datanascimento"
          [(ngModel)]="datanascimento"
        >
      </div>

      <div class="input-group">
        <label for="sexo">Sexo</label>
        <select
          id="sexo"
          name="sexo"
          [(ngModel)]="sexo"
        >
          <option value="" disabled>Selecione</option>
          <option value="M">Masculino</option>
          <option value="F">Feminino</option>
          <option value="O">Outro</option>
        </select>
      </div>

      <div class="input-group">
        <label for="telefone">Telefone</label>
        <input
          type="tel"
          id="telefone"
          name="telefone"
          [(ngModel)]="telefone"
          placeholder="(79) 99999-9999"
        >
      </div>

      <div class="input-group">
        <label for="CEP">CEP</label>
        <input
        type="text"
        id="CEP"
        name="CEP"
        [(ngModel)]="CEP"
        placeholder="49000-000"
        >
      </div>

      <div class="input-group">
        <label for="Numero">Número do endereço</label>
        <input
          type="text"
          id="Numero"
          name="Numero"
          [(ngModel)]="Numero"
          placeholder="Número da residência"
        >
      </div>

      <div class="input-group">
        <label for="Complemento">Complemento</label>
        <input
          type="text"
          id="Complemento"
          name="Complemento"
          [(ngModel)]="Complemento"
          placeholder="Apartamento, bloco etc. (opcional)"
        >
      </div>

      @if (mensagem()) {
        <div class="message-box" [class.error]="erroGeral()" [class.success]="!erroGeral()" role="alert">
          {{ mensagem() }}
        </div>
      }

      <button type="submit" class="btn-login" [disabled]="enviando()">
        {{ enviando() ? 'Cadastrando...' : 'Cadastrar' }}
      </button>

    </form>

    <div class="register-prompt">
      Já tem uma conta?
      <a routerLink="/login">Entrar</a>
    </div>

  </div>
</div>
