<header id="cabecalho">

  <div class="linha-superior">

    <div id="logo" routerLink="/home" style="cursor: pointer;">
      Produtos <span id="titulo-logo"> Esporte </span>
    </div>

    <div id="pesquisa">
      <input type="text" placeholder="O que está buscando?">
      <button type="submit"></button>
    </div>

    <div class="acoes-nome">

      <div id="portal">
        <strong>Portal do Funcionário</strong>
        <button routerLink="/portal" class="action-button">Acessar</button>
      </div>

      @if (usuario(); as pessoa) {
        <div id="usuario-logado">
          <span class="saudacao">Olá,</span>
          <strong class="nome-usuario" [title]="pessoa.nome">{{ pessoa.nome }}</strong>
          <button type="button" class="btn-sair" (click)="sair()">Sair</button>
        </div>
      } @else {
        <div id="login-cadastro">
          <strong>Minha conta</strong>
          <div class="botoes-acao">
            <button routerLink="/login" class="action-button">Entrar</button>
            <button routerLink="/cadastro" class="action-button">Cadastrar</button>
          </div>
        </div>
      }

      <div id="carrinho" routerLink="/carrinho">
        <strong>Carrinho</strong>
      </div>

    </div>

  </div>

  <!-- Linha Inferior: Menu de Navegação -->
  <nav id="menu">
    <ul id="ul-menu">
      <li><a routerLink="/home" class="lnk-menu">Home</a></li>
      <li><a routerLink="/sobre" class="lnk-menu">Sobre</a></li>
    </ul>
  </nav>

</header>
