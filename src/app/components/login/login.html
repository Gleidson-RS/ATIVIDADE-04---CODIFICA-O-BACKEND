<form (ngSubmit)="entrar()" #formLogin="ngForm">

  <div class="input-group">
    <label for="email">E-mail</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="Digite seu e-mail"
      [(ngModel)]="email"
      required
      email
    >
  </div>

  <div class="input-group">
    <label for="CPF">CPF</label>
    <input
      type="text"
      id="CPF"
      name="CPF"
      placeholder="Digite seu CPF"
      [(ngModel)]="CPF"
      required
    >
  </div>

  <div class="options-group">
    <label class="checkbox-label">
      <input
        type="checkbox"
        name="manterLogado"
        [(ngModel)]="manterLogado"
      >
      Manter logado
    </label>
  </div>

  @if (mensagem) {
    <p [style.color]="erro ? '#e53935' : 'green'">
      {{ mensagem }}
    </p>
  }

  <button
    type="submit"
    class="btn-login"
    [disabled]="formLogin.invalid || carregando"
  >
    {{ carregando ? 'Verificando...' : 'Entrar' }}
  </button>

</form>
